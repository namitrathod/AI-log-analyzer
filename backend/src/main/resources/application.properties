server.port=8080
spring.application.name=log-analyzer

# Ollama settings — set these in your .env file
ai.api.url=${AI_API_URL:http://localhost:11434}
ai.model=${AI_MODEL:llama3.2}
ai.max.tokens=1024

batch.max.items=20
rate.limit.per.minute=${RATE_LIMIT_PER_MINUTE:10}

logging.level.com.loganalyzer=DEBUG
